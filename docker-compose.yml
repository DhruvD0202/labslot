services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: labslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker}
      POSTGRES_DB: labslot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - labslot_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labslot -d labslot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  labslot_data:
